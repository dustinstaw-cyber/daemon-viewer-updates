name: Publish signed Daemon Viewer 1.7.49 security update
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-1.7.49.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daemon-viewer-release-1.7.49
  cancel-in-progress: false
jobs:
  verified-signed-update:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Rebuild signed patches and official Electron core; retain legacy latest
        shell: pwsh
        run: |
          $publisher = Join-Path $env:RUNNER_TEMP 'publish-1.7.49.cjs'
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/release-payloads/publish-1.7.49.cjs" -OutFile $publisher
          node $publisher
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
