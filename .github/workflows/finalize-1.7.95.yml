name: Finalize immutable 1.7.95 and verify public CDN downloads
on:
  push:
    branches: [main]
    paths: ['.github/workflows/finalize-1.7.95.yml']
permissions:
  contents: write
concurrency:
  group: daemon-viewer-release-1.7.95
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Verify signed manifests, compatible channel and every published asset
        run: |
          curl --fail --retry 3 -o "$RUNNER_TEMP/finalize.cjs" "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/release-payloads/finalize-1.7.95.cjs"
          node "$RUNNER_TEMP/finalize.cjs"

# Draft releases are addressed by verified numeric release ID.
