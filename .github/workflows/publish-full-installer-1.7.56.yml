name: Verify and publish full Daemon Viewer installer 1.7.56
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-full-installer-1.7.56.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-full-installer-1.7.56
  cancel-in-progress: false
jobs:
  verify-install-and-publish:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout: installer-build/1.7.56
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Install isolated UI test dependency
        shell: pwsh
        run: npm install --prefix installer-build/1.7.56/qa-deps playwright@1.62.1 --ignore-scripts --no-audit --no-fund
      - name: Verify signed installer, test fresh install and repair, publish
        shell: pwsh
        run: |
          node installer-build/1.7.56/publish-installer.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: full-installer-1.7.56-verification
          path: |
            installer-build/1.7.56/qa/*.json
            installer-build/1.7.56/qa/*.png
            installer-build/1.7.56/qa-install.log
          retention-days: 14

# Normalize PEM line endings before verifying the pinned publisher fingerprint.
