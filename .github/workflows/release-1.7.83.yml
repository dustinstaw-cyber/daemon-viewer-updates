name: Prepare updated 1.7.83 payload with Enyro waterfalls
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-1.7.83.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daemon-viewer-release-1.7.83
  cancel-in-progress: true
jobs:
  prepare-updated-payload:
    runs-on: windows-latest
    steps:
      - name: Await updated verified payload
        shell: pwsh
        run: Write-Output 'Publication replaced by the requested Enyro waterfall addition. Updated signed payload will follow.'
