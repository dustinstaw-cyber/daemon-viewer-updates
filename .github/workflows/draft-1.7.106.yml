name: Build final Map Studio Daemon M2 Tool 1.7.106 draft
on:
  push:
    branches: [main]
    paths: ['.github/workflows/draft-1.7.106.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daemon-viewer-release-1.7.106
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Verify previous signatures and build all supported file patches
        shell: pwsh
        run: |
          $publisher = Join-Path $env:RUNNER_TEMP 'draft-1.7.106.cjs'
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/release-payloads/draft-1.7.106.cjs" -OutFile $publisher -MaximumRetryCount 3
          node $publisher
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

