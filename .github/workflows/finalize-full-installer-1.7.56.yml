name: Finalize verified full installer 1.7.56 download and migration channel
on:
  push:
    branches: [main]
    paths: ['.github/workflows/finalize-full-installer-1.7.56.yml']
permissions:
  contents: write
  actions: read
jobs:
  finalize-tested-installer:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout: installer-build/1.7.56
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Verify complete public download and successful installer tests, enable latest route
        shell: pwsh
        run: |
          node installer-build/1.7.56/finalize-installer.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-installer-1.7.56-publication
          path: installer-build/1.7.56/final-publication.json
          retention-days: 14
