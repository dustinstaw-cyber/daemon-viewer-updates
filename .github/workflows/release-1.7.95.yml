name: Publish signed Daemon M2 Tool 1.7.95 Christmas pack and snowfall

on:

  push:

    branches: [main]

    paths: ['.github/workflows/release-1.7.95.yml']

  workflow_dispatch:

permissions:

  contents: write

concurrency:

  group: daemon-viewer-release-1.7.95

  cancel-in-progress: false

jobs:

  verified-environment-patch:

    runs-on: windows-latest

    timeout-minutes: 60

    env:

      GH_TOKEN: ${{ github.token }}

    steps:

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020

        with:

          node-version: '24.22.1'

      - name: Reproduce and publish independently signed change packages

        shell: pwsh

        run: |

          $publisher = Join-Path $env:RUNNER_TEMP 'publish-1.7.95.cjs'

          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/release-payloads/publish-1.7.95.cjs" -OutFile $publisher -MaximumRetryCount 3

          node $publisher

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }


